<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Eva</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --fg:#e8e8ea; --dim:#8b8f98; --you:#7cc4ff; --eva:#9be79b; --warn:#ffcf6e; --err:#ff7a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, system-ui, Segoe UI, Roboto, sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding: max(12px, env(safe-area-inset-top)) 16px 8px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  #status { color:var(--dim); font-size:14px; flex:1; }
  #meter { width:44px; height:8px; background:#22252c; border-radius:4px; overflow:hidden; }
  #meter i { display:block; height:100%; width:0; background:var(--you); transition: width .08s; }
  #log { flex:1; overflow-y:auto; padding:8px 16px; -webkit-overflow-scrolling:touch; }
  .line { margin:6px 0; white-space:pre-wrap; word-break:break-word; }
  .you { color:var(--you); } .eva { color:var(--eva); } .dim { color:var(--dim); font-size:13px; } .warn { color:var(--warn); } .err { color:var(--err); }
  footer { display:flex; gap:10px; padding:10px 16px max(14px, env(safe-area-inset-bottom)); }
  button { flex:1; font-size:17px; padding:14px 10px; border:0; border-radius:12px; background:#2b2f3a; color:var(--fg); }
  button.primary { background:#3b82f6; } button:disabled { opacity:.45; }
  #speaking { display:none; }
</style>
</head>
<body>
<header>
  <h1>Eva</h1>
  <div id="status">tap Start</div>
  <div id="meter"><i id="meterbar"></i></div>
</header>
<div id="log"></div>
<footer>
  <button id="start" class="primary">Start</button>
  <button id="stop" disabled>Stop her</button>
  <button id="end" disabled>End</button>
</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), status = $("status"), meterbar = $("meterbar");
  const startBtn = $("start"), stopBtn = $("stop"), endBtn = $("end");
  let ws, ctx, micNode, playNode, stream, outRate = 24000, running = false, evaLine = null;

  function line(cls, text) {
    const el = document.createElement("div"); el.className = "line " + cls; el.textContent = text;
    log.appendChild(el); log.scrollTop = log.scrollHeight; return el;
  }
  function setStatus(t) { status.textContent = t; }

  // ---- worklets (inlined so this stays one file) ---------------------------------
  const captureWorklet = `
    class Cap extends AudioWorkletProcessor {
      constructor() { super(); this.buf = new Float32Array(0); this.n = Math.round(sampleRate * 0.02); }
      process(inputs) {
        const ch = inputs[0] && inputs[0][0]; if (!ch) return true;
        const merged = new Float32Array(this.buf.length + ch.length); merged.set(this.buf); merged.set(ch, this.buf.length);
        let i = 0, peak = 0;
        for (; i + this.n <= merged.length; i += this.n) {
          const out = new Int16Array(this.n);
          for (let k = 0; k < this.n; k++) { const v = Math.max(-1, Math.min(1, merged[i + k])); out[k] = v < 0 ? v * 32768 : v * 32767; if (Math.abs(v) > peak) peak = Math.abs(v); }
          this.port.postMessage({ pcm: out.buffer, peak }, [out.buffer]);
        }
        this.buf = merged.slice(i); return true;
      }
    }
    registerProcessor("cap", Cap);`;
  const playWorklet = `
    class Play extends AudioWorkletProcessor {
      // A jitter buffer: hold `pre` seconds before a reply starts, and after the queue runs dry
      // mid-reply hold `re` seconds before resuming, so a Wi-Fi hiccup is one short pause instead
      // of a stutter. "eot" (end of the reply) or 400 ms without new data drains whatever is held.
      constructor() { super(); this.q = []; this.off = 0; this.queued = 0; this.played = 0; this.tone = 0; this.lp = 0;
        this.pre = 0.25 * sampleRate; this.re = 0.15 * sampleRate; this.need = this.pre; this.playing = false;
        this.drain = false; this.lastData = 0; this.underruns = 0;
        this.port.onmessage = (e) => { const m = e.data;
          if (m.flush) { this.q = []; this.off = 0; this.queued = 0; this.playing = false; this.need = this.pre; this.drain = false;
                         this.port.postMessage({ stopped: true, played: this.played }); this.played = 0; }
          else if (m.eot) { this.drain = true; }
          else if (m.prebuffer !== undefined) { this.pre = m.prebuffer * sampleRate; this.need = this.pre; }
          else if (m.roomTone !== undefined) { this.tone = m.roomTone === null ? 0 : Math.pow(10, m.roomTone / 20) * 3.8; /* uniform noise through the 0.35 one-pole has rms 0.266 */ }
          else if (m.pcm) { const a = new Float32Array(m.pcm); this.q.push(a); this.queued += a.length; this.lastData = currentTime; this.drain = false; } };
      }
      process(inputs, outputs) {
        const out = outputs[0][0]; let i = 0;
        if (!this.playing && this.queued > 0) {
          const stale = currentTime - this.lastData > 0.4;
          if (this.queued >= this.need || this.drain || stale) this.playing = true;
        }
        if (this.playing) {
          while (i < out.length && this.q.length) {
            const head = this.q[0]; const take = Math.min(out.length - i, head.length - this.off);
            out.set(head.subarray(this.off, this.off + take), i); i += take; this.off += take; this.played += take; this.queued -= take;
            if (this.off >= head.length) { this.q.shift(); this.off = 0; }
          }
          if (i < out.length) {  // ran dry
            if (this.drain) { this.playing = false; this.need = this.pre; this.drain = false; }        // the reply is over
            else { this.playing = false; this.need = this.re; this.underruns++;                     // a hiccup: rebuffer briefly
                   if (this.underruns % 3 === 0 && this.pre < 0.6 * sampleRate) this.pre *= 1.5;   // and grow the prebuffer if it keeps happening
                   this.port.postMessage({ underrun: this.underruns }); }
          }
        }
        for (; i < out.length; i++) { this.lp += 0.35 * ((Math.random() * 2 - 1) - this.lp); out[i] = this.lp * this.tone; }
        return true;
      }
    }
    registerProcessor("play", Play);`;
  const blobUrl = (code) => URL.createObjectURL(new Blob([code], { type: "application/javascript" }));

  // 24 kHz int16 -> float at the context rate (linear), done here so the worklet just plays
  function toContextRate(int16) {
    const src = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) src[i] = int16[i] / 32768;
    if (ctx.sampleRate === outRate) return src;
    const ratio = outRate / ctx.sampleRate, n = Math.floor(src.length / ratio);
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) { const p = i * ratio, j = Math.floor(p), f = p - j; out[i] = src[j] + (src[Math.min(j + 1, src.length - 1)] - src[j]) * f; }
    return out;
  }
  let carry = new Int16Array(0);  // keep 24 kHz sample continuity across messages for the resampler

  async function start() {
    startBtn.disabled = true; setStatus("asking for the mic...");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }, video: false });
    } catch (e) { setStatus("mic blocked: " + e.message + (location.protocol === "http:" ? " (needs https)" : "")); startBtn.disabled = false; return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    await ctx.audioWorklet.addModule(blobUrl(captureWorklet));
    await ctx.audioWorklet.addModule(blobUrl(playWorklet));
    playNode = new AudioWorkletNode(ctx, "play", { numberOfInputs: 0, outputChannelCount: [1] });
    playNode.connect(ctx.destination);
    playNode.port.onmessage = (e) => {
      if (e.data.stopped && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "stopped", played: e.data.played }));
      if (e.data.underrun) setStatus("network hiccup (" + e.data.underrun + ")");
    };
    const src = ctx.createMediaStreamSource(stream);
    micNode = new AudioWorkletNode(ctx, "cap", { numberOfInputs: 1, numberOfOutputs: 0 });
    src.connect(micNode);
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
    setStatus("connecting to " + location.host + "...");
    ws = new WebSocket(url); ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: "hello", sampleRate: ctx.sampleRate, ua: navigator.userAgent }));
      running = true; stopBtn.disabled = false; endBtn.disabled = false; setStatus("listening (mic " + ctx.sampleRate + " Hz)");
      micNode.port.onmessage = (e) => { if (ws.readyState === 1) ws.send(e.data.pcm); meterbar.style.width = Math.min(100, e.data.peak * 300) + "%"; };
    };
    ws.onmessage = (e) => {
      if (typeof e.data === "string") { onEvent(JSON.parse(e.data)); return; }
      const merged = new Int16Array(carry.length + e.data.byteLength / 2); merged.set(carry); merged.set(new Int16Array(e.data), carry.length);
      const f = toContextRate(merged); carry = new Int16Array(0);
      playNode.port.postMessage({ pcm: f.buffer }, [f.buffer]);
    };
    ws.onclose = () => { running = false; setStatus("disconnected"); stopBtn.disabled = true; endBtn.disabled = true; startBtn.disabled = false; startBtn.textContent = "Reconnect"; if (stream) stream.getTracks().forEach(t => t.stop()); };
    ws.onerror = () => setStatus("connection failed");
  }

  function onEvent(m) {
    if (m.type === "config") { outRate = m.sampleRate; if (playNode) { playNode.port.postMessage({ roomTone: m.roomToneDbfs === undefined ? null : m.roomToneDbfs }); if (m.prebufferS) playNode.port.postMessage({ prebuffer: m.prebufferS }); } return; }
    if (m.type === "eot") { if (playNode) playNode.port.postMessage({ eot: true }); return; }
    if (m.type === "stop") { playNode.port.postMessage({ flush: true }); return; }
    if (m.type === "busy") { line("warn", "another client is connected; try again in a moment"); return; }
    if (m.type !== "event") return;
    const d = m.data || {};
    switch (m.name) {
      case "stt": line("you", "you: " + d.text); break;
      case "turn": evaLine = null; line("eva", "eva: " + d.assistant_text + (d.interrupted ? "  [interrupted]" : "")); setStatus("listening"); break;
      case "state": setStatus(d.to === "listening" ? "listening" : d.to === "thinking" ? "thinking..." : "speaking"); break;
      case "filler": setStatus("mm..."); break;
      case "barge_in": line("dim", "(interrupted her)"); break;
      case "barge_in_echo": line("dim", "(hearing herself through your speaker, not stopping)"); break;
      case "stt_echo": line("dim", "(her own voice through the mic, ignored)"); break;
      case "stt_hesitation": line("dim", "(hesitation, waiting)"); break;
      case "stt_phantom": line("dim", "(ignored as noise)"); break;
      case "utterance_carried": line("dim", "(holding that, go on...)"); break;
      case "language": line("dim", "(switching to " + d.lang + ")"); break;
      case "tool_call": line("dim", "tool: " + d.name + " " + JSON.stringify(d.arguments)); break;
      case "failover": line("warn", d.kind + ": " + d.from + " not answering, using " + d.to); break;
      case "recovered": line("dim", d.kind + ": " + d.name + " is back"); break;
      case "echo_storm": line("warn", "the speaker keeps reaching the mic: for " + d.hold_s + " s only a full transcript can interrupt her. Try headphones."); break;
      case "session_end": line("dim", "(she ended the call)"); break;
      case "error": line("err", "error (" + d.where + "): " + d.error); break;
    }
  }

  startBtn.onclick = start;
  stopBtn.onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "interrupt" })); };
  endBtn.onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "bye" })); };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ctx && ctx.state !== "running") ctx.resume(); });
})();
</script>
</body>
</html>
